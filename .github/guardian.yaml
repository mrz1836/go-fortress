# Guardian CI Testing Framework - Policy Exceptions
#
# This file defines exceptions to Guardian policy rules.
# Use exceptions sparingly and document the reason clearly.
#
# Format:
#   exceptions:
#     - policy: <policy-id>           # Required: ID of the policy to bypass
#       path: <glob-pattern>          # Required: File path or pattern
#       reason: <explanation>         # Required: Why this exception exists
#       expires: <YYYY-MM-DD>         # Optional: When to review this exception
#       approved_by: <github-handle>  # Optional: Who approved this exception
#       created_at: <YYYY-MM-DD>      # Required: When this was created

exceptions:
  - policy: no-dangerous-workflows
    path: .github/workflows/pull-request-management-fork.yml
    reason: "Implements GitHub's recommended two-workflow security pattern. Only checks out base branch (ref: github.base_ref), never PR head. See workflow header documentation for security analysis."
    approved_by: "@mrz1836"
    created_at: 2026-01-25

