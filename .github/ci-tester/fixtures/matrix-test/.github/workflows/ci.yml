name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest]
        go-version: ["1.23", "1.24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Show matrix info
        run: |
          echo "matrix test running"
          echo "os: ${{ matrix.os }}"
          echo "version: ${{ matrix.go-version }}"
          echo "Go version from matrix: ${{ matrix.go-version }}"
      - name: Run tests
        run: |
          echo "Running on ${{ matrix.os }} with Go ${{ matrix.go-version }}"
          go run main.go || echo "Test completed"
