name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  env-validation:
    name: Environment Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate modular env system
        run: |
          if [ -d .github/env ] && [ -f .github/env/load-env.sh ]; then
            echo "Modular env system found"
            source .github/env/load-env.sh
            if [ -n "$APP_NAME" ]; then
              echo "env schema valid"
              echo "schema pass"
            else
              echo "APP_NAME not set after loading env"
              exit 1
            fi
          else
            echo "Missing modular env system (.github/env/)"
            exit 1
          fi
