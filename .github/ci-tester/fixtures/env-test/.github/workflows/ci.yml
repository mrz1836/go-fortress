name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  env-validation:
    name: Environment Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate env schema
        run: |
          if [ -f .env.base ]; then
            echo "env schema valid"
            echo "schema pass"
          else
            echo "Missing .env.base"
            exit 1
          fi
