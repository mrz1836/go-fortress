name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_8.18.0_linux_x64.tar.gz | tar xz
          chmod +x gitleaks
      - name: Run gitleaks manually
        run: ./gitleaks detect --source . --verbose

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks action
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gitleaks-custom:
    name: Gitleaks Custom Patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_8.18.0_linux_x64.tar.gz | tar xz
          chmod +x gitleaks
      - name: Create custom config
        run: |
          cat > .gitleaks-custom.toml << 'EOF'
          title = "Custom Gitleaks Config"
          [[rules]]
          id = "custom-api-key"
          description = "Custom API Key Pattern"
          regex = '''sk-proj-[A-Za-z0-9]{32}'''
          tags = ["custom", "api-key"]
          EOF
      - name: Run gitleaks with custom patterns
        run: ./gitleaks detect --source . --config .gitleaks-custom.toml --verbose
