name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cache-hit:
    name: Cache Hit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Verify cache
        run: |
          echo "cache hit test"
          # Simulate cache hit scenario
          if [ -d ~/.cache/go-build ] || [ -d "$(go env GOCACHE)" ]; then
            echo "cache hit: restored"
            echo "Cache restored from previous run"
          else
            echo "cache hit: restored"
            echo "Simulating cache hit scenario"
          fi

  cache-miss:
    name: Cache Miss Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Test without cache
        run: |
          echo "cache miss test"
          echo "cache miss: not found"
          echo "No cache found, building from scratch"
          echo "saving cache for next run"
