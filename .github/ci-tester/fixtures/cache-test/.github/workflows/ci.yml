name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cache-hit:
    name: Cache Hit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Verify cache
        run: |
          echo "cache hit test"
          if [ -d ~/.cache/go-build ]; then
            echo "cache hit: restored"
          else
            echo "cache miss: not found"
          fi

  cache-miss:
    name: Cache Miss Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false
      - name: Test without cache
        run: |
          echo "cache miss test"
          echo "not found"
          echo "saving cache"
