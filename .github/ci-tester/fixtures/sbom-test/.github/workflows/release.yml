name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Generate SPDX SBOM
        run: |
          echo "Generating SBOM..."
          go install github.com/spdx/tools-golang/cmd/gospdx@latest || echo "SPDX tools installed"
          echo "SPDX SBOM generated"
          echo "CycloneDX compatible"
          echo "sbom output"
          echo "bom generated"
