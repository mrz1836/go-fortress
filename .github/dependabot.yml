# ────────────────────────────────────────────────────────────────
# Dependabot Configuration
#
# Purpose:
#   • Keep Go modules, GitHub Actions and DevContainer images/features up‑to‑date with zero‑day
#     security patches and semantic‑version upgrades.
#   • Reduce attack surface by limiting outdated dependencies.
#   • Minimise PR noise via smart grouping and sane pull‑request limits.
#
# References:
#   https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#   https://docs.github.com/en/code-security/dependabot/configuration-options-for-dependency-updates
#
# Security Hardened Defaults:
#   • Weekly cadence (Monday 09:00 America/New_York) – align with CVE dump cycle.
#   • Direct dependencies only – prevents unsolicited transitive churn.
#   • PRs labeled, assigned, and target the protected "master" branch.
#   • PR titles prefixed with chore(scope): – conventional commits.
#   • Force‑push and delete‑branch disabled via branch‑protection rules.
#   • PR limit = 10 to avoid queue flooding.
#   • All dependency PRs require passing CI + CODEOWNERS review.
# ────────────────────────────────────────────────────────────────

version: 2

updates:
  # ──────────────────────────────────────────────────────────────
  # 1. Go Modules (go.mod / go.sum)
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "gomod"
    directories: ["/", "/magefiles"]
    target-branch: "master"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    allow:
      # "all" (not just "direct") is required so shared deps that are DIRECT in
      # the root module but only TRANSITIVE in /magefiles (coupled via the
      # `replace ../` directive) get bumped in BOTH directories within the same
      # multi-directory group PR. Otherwise the guardian "magefiles go.mod in
      # sync" gate fails on every shared-dependency update. Grouping below keeps
      # this to a single weekly PR.
      - dependency-type: "all"
    groups:
      gomod-all:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "go.yaml.in/yaml/v4"
    open-pull-requests-limit: 10
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "gomod"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # ──────────────────────────────────────────────────────────────
  # 1a. CI Test Fixtures — vuln-fail (NEVER update)
  #     This fixture intentionally pins vulnerable deps for SEC-003.
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "gomod"
    directory: "/.github/ci-tester/fixtures/vuln-fail"
    target-branch: "master"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
    open-pull-requests-limit: 0

  # ──────────────────────────────────────────────────────────────
  # 2. GitHub Actions Workflows
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "daily"
      time: "09:15"
      timezone: "America/New_York"
    allow:
      - dependency-type: "direct"
    groups:
      ghactions-all:
        patterns: ["*"]
    open-pull-requests-limit: 10
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "github-actions"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # ──────────────────────────────────────────────────────────────
  # 2b. GitHub Actions — Composite Actions (.github/actions/*)
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directories:
      - "/.github/actions/*"
    target-branch: "master"
    schedule:
      interval: "daily"
      time: "09:15"
      timezone: "America/New_York"
    groups:
      ghactions-all:
        patterns: ["*"]
    open-pull-requests-limit: 5
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "github-actions"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # ──────────────────────────────────────────────────────────────
  # 3. DevContainer (devcontainer.json : base image + features)
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "devcontainers"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/New_York"
    allow:
      - dependency-type: "direct"
    groups:
      devcontainer-all:
        patterns: ["*"]
    open-pull-requests-limit: 5
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "devcontainer"]
    commit-message:
      prefix: "chore"
      include: "scope"
