# ────────────────────────────────────────────────────────────────
# Dependabot Configuration
#
# Purpose:
#   • Keep Go modules, GitHub Actions, and DevContainer base images/features
#     up-to-date with zero-day security patches and semantic-version upgrades.
#   • Reduce attack surface by limiting outdated dependencies.
#   • Minimise PR noise via smart grouping and sane pull‑request limits.
#
# References:
#   https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
#   https://docs.github.com/en/code-security/dependabot/configuration-options-for-dependency-updates
#
# Security Hardened Defaults:
#   • Weekly cadence (Monday 09:00 America/New_York) – align with CVE dump cycle.
#   • Direct dependencies only – prevents unsolicited transitive churn.
#   • PRs labeled, assigned, and target the protected "master" branch.
#   • PR titles prefixed with chore(scope): – conventional commits.
#   • Force‑push and delete‑branch disabled via branch‑protection rules.
#   • PR limit = 10 to avoid queue flooding.
#   • All dependency PRs require passing CI + CODEOWNERS review.
# ────────────────────────────────────────────────────────────────

version: 2

updates:
  # ──────────────────────────────────────────────────────────────
  # 1. Go Modules (go.mod / go.sum)
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    allow:
      - dependency-type: "direct"
    groups:
      security-deps:
        patterns:
          - "*crypto*"
          - "*security*"
          - "*auth*"
          - "*jwt*"
          - "*oauth*"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "go.yaml.in/yaml/v4"
    open-pull-requests-limit: 10
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "gomod"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # ──────────────────────────────────────────────────────────────
  # 1a. CI Test Fixtures — vuln-fail (NEVER update)
  #     This fixture intentionally pins vulnerable deps for SEC-003.
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "gomod"
    directory: "/.github/ci-tester/fixtures/vuln-fail"
    target-branch: "master"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
    open-pull-requests-limit: 0

  # ──────────────────────────────────────────────────────────────
  # 1b. Go Modules (magefiles/go.mod - Mage build tool)
  #     NOTE: Allows both direct AND indirect deps to keep in sync
  #           with parent module's transitive dependencies.
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "gomod"
    directory: "/magefiles"
    target-branch: "master"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    groups:
      mage-deps:
        patterns:
          - "*mage*"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "go.yaml.in/yaml/v4"
    open-pull-requests-limit: 5
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "gomod", "magefiles"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # ──────────────────────────────────────────────────────────────
  # 2. GitHub Actions Workflows
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "master"
    schedule:
      interval: "daily"
      time: "08:15"
      timezone: "America/New_York"
    allow:
      - dependency-type: "direct"
    groups:
      ghactions-all:
        patterns: ["*"]
    open-pull-requests-limit: 10
    assignees: ["mrz1836"]
    labels: ["chore", "dependencies", "github-actions"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # ──────────────────────────────────────────────────────────────
  # 2b. GitHub Actions — Composite Actions (.github/actions/*)
  #     NOTE: Dependabot's github-actions ecosystem only scans
  #     .github/workflows/ when directory is "/". Composite actions
  #     in .github/actions/ subdirectories require explicit entries.
  # ──────────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/cache-act-images"
