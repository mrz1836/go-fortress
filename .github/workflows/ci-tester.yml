name: CI Tester (Guardian)

on:
  pull_request:
    paths:
      - '.github/**'
      - 'guardian/**'
      - 'magefile.go'
      - '.env.base'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read
  security-events: write  # Required for SARIF upload
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"
          cache: true

      - name: Install Mage
        run: go install github.com/magefile/mage@latest

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@latest

      - name: Run static validation
        run: mage ci:static

  verify:
    name: Full Verification
    runs-on: ubuntu-latest
    needs: static
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"
          cache: true

      - name: Install Mage
        run: go install github.com/magefile/mage@latest

      - name: Install act
        run: |
          curl -s https://raw.githubusercontent.com/nektos/act/master/install.sh | sudo bash -s -- -b /usr/local/bin
          act --version

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@latest

      - name: Run full verification
        run: mage ci:verify

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@38e701f46e33fb233075bf4238cb1e5d68e429e4 # v3
        if: always()
        with:
          sarif_file: .mage-x/guardian.sarif
          category: guardian

      - name: Upload JSONL report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-results
          path: .mage-x/ci-results.jsonl
          retention-days: 30

  scenarios-quick:
    name: Quick Scenarios
    runs-on: ubuntu-latest
    needs: static
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"
          cache: true

      - name: Install Mage
        run: go install github.com/magefile/mage@latest

      - name: Install act
        run: |
          curl -s https://raw.githubusercontent.com/nektos/act/master/install.sh | sudo bash -s -- -b /usr/local/bin
          act --version

      - name: Run quick tests
        run: mage ci:test
